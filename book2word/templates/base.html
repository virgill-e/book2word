<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>book2word</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="logo"><img src="{{ url_for('static', filename='favicon.png') }}" alt="" class="logo-icon">book2word</span>
      <span class="tagline">Livre PDF → document Word</span>
      <form action="{{ url_for('shutdown') }}" method="post" class="quit-form" id="quit-form">
        <button type="submit" class="btn-quit">Quitter l'application</button>
      </form>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <div class="footer-inner">Application locale — rien n'est envoyé sur internet.</div>
  </footer>
  <script>
  // Vérifie au moment du clic (pas au chargement de la page) si une conversion tourne :
  // quitter l'interromprait et le travail serait perdu.
  document.getElementById('quit-form').addEventListener('submit', function (event) {
    event.preventDefault();
    const form = this;
    fetch('/api/running')
      .then(r => r.json())
      .then(data => data.running.length > 0)
      .catch(() => false)
      .then(running => {
        const message = running
          ? 'Une conversion est en cours : elle sera interrompue et perdue.\n\nFermer book2word quand même ?'
          : 'Fermer book2word ?';
        if (confirm(message)) form.submit();
      });
  });
  </script>
</body>
</html>
